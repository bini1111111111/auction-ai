<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공매가 AI 9.1</title><style>
body{font-family:Arial,sans-serif;max-width:1050px;margin:28px auto;padding:0 18px;background:#f6f7f9;color:#20242a}
.card{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:14px 0}h1{margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:13px}input,select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #bbb;border-radius:8px}
button{padding:12px 20px;border:0;border-radius:9px;background:#222;color:white;font-weight:bold;cursor:pointer}.muted{color:#666;font-size:13px}
.metrics{display:flex;gap:12px;flex-wrap:wrap}.metric{padding:10px 13px;background:#f1f3f5;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}a{color:#2457c5}pre{white-space:pre-wrap}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body>
<h1>공매가 AI 9.1</h1><div class="muted">데이터수집 진단형 · 검색결과가 어디에서 탈락하는지 단계별로 확인</div>
<div class="card"><div class="grid">
<label>차량명<input id="car" value="쏘렌토 하이브리드 1.6 2WD 그래비티"></label>
<label>연식<input id="year" type="number" value="2023"></label>
<label>주행거리 km<input id="km" type="number" value="55000"></label>
<label>사고 횟수<input id="accident_count" type="number" value="0"></label>
<label>사고금액 만원<input id="accident_amount" type="number" value="0"></label>
<label>부품비 만원<input id="parts_amount" type="number" value="0"></label>
<label>자차 미가입<select id="uninsured"><option>없음</option><option>있음</option></select></label>
<label>용도<select id="usage"><option>일반</option><option>렌터카</option><option>영업용</option></select></label>
<label>골격손상<select id="frame_damage"><option>없음</option><option>있음</option></select></label>
<label>상태<select id="condition"><option>양호</option><option>보통</option><option>불량</option></select></label>
<label>환금성<select id="marketability"><option>보통</option><option>높음</option><option>낮음</option></select></label>
<label>특장<select id="special_body"><option>아님</option><option>특장</option></select></label>
<label>수동 비교가격(선택)<input id="manual_prices" placeholder="예: 3390, 3500, 3550"></label>
</div><p><button onclick="go()">분석하기</button></p></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id), f=n=>Number(n||0).toLocaleString('ko-KR');
function val(id){return $(id).value}
async function go(){
 $('out').innerHTML='<div class="card">검색하고 있어…</div>';
 const body={car:val('car'),year:+val('year'),km:+val('km'),accident_count:+val('accident_count'),
 accident_amount:+val('accident_amount'),parts_amount:+val('parts_amount'),uninsured:val('uninsured'),
 usage:val('usage'),frame_damage:val('frame_damage'),condition:val('condition'),
 marketability:val('marketability'),special_body:val('special_body'),manual_prices:val('manual_prices')};
 try{
  const r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await r.text(); let d; try{d=JSON.parse(text)}catch(e){throw new Error(text)}
  render(d);
 }catch(e){$('out').innerHTML='<div class="card"><b>오류</b><pre>'+e.message+'</pre></div>'}
}
function render(d){
 if(d.status==='error'){ $('out').innerHTML='<div class="card"><b>서버 오류</b><pre>'+d.message+'</pre></div>'; return}
 const p=d.pipeline||{};
 let x='<div class="card"><h2>데이터 수집 진단</h2><div class="metrics">'+
 ['검색결과 '+f(p.search_results)+'건','가격 추출 '+f(p.price_extracted)+'건','차량정보 인식 '+f(p.vehicle_info_detected)+'건','비교후보 '+f(p.candidate_count)+'건','최종 채택 '+f(p.adopted)+'건','제외 '+f(p.rejected)+'건'].map(v=>'<div class="metric">'+v+'</div>').join('')+'</div></div>';
 x+='<div class="card"><h2>결과</h2>';
 if(d.status==='ok') x+='<h3>현실 공매가 '+f(d.auction_low)+'~'+f(d.auction_high)+'만원</h3><p>대표 소매시세 <b>'+f(d.retail)+'만원</b> · 목표 '+f(d.target)+'만원 · 절대 상한 '+f(d.upper)+'만원 · 할인 '+d.discount+'% · 신뢰도 '+d.confidence+'</p>';
 else x+='<h3>공매가 산정 보류</h3><p>'+d.message+'</p>';
 if(d.market_low) x+='<p>비교가격 '+f(d.market_low)+'~'+f(d.market_high)+'만원 · 편차 '+d.spread+'%</p>';
 x+='</div>';
 const rows=d.adopted||[];
 if(rows.length){x+='<div class="card"><h2>채택 비교자료</h2><table><tr><th>가격</th><th>보정가</th><th>연식</th><th>km</th><th>유사도</th><th>출처</th></tr>'+
 rows.map(a=>'<tr><td>'+f(a.price)+'</td><td>'+f(a.adjusted_price)+'</td><td>'+(a.year||'-')+'</td><td>'+f(a.mileage||0)+'</td><td>'+a.score+'</td><td>'+(a.url?'<a target="_blank" href="'+a.url+'">'+(a.source||'보기')+'</a>':a.source)+'</td></tr>').join('')+'</table></div>'}
 const rej=d.rejected||[];
 if(rej.length){x+='<div class="card"><details><summary>제외자료 '+rej.length+'건 보기</summary><table><tr><th>가격</th><th>사유</th><th>제목</th></tr>'+
 rej.map(a=>'<tr><td>'+f(a.price)+'</td><td>'+a.reason+'</td><td>'+a.title+'</td></tr>').join('')+'</table></details></div>'}
 if((d.errors||[]).length)x+='<div class="card"><b>검색 오류</b><pre>'+d.errors.join('\n')+'</pre></div>';
 $('out').innerHTML=x;
}
</script></body></html>
